<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribbleCode</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace', 'ui-monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Transition utility */
        .transition-all-custom {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Line number styling */
        .line-numbers {
            user-select: none;
            counter-reset: line;
        }
        /* Custom styling for scratchpad panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-full bg-[#f8fafc] dark:bg-[#0b0d13] text-slate-800 dark:text-slate-100 font-sans antialiased overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification System -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all-custom duration-300 pointer-events-none">
        <div class="bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700/60 flex items-center space-x-3 text-sm font-medium">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
            <span id="toast-message">Action completed successfully</span>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="flex h-full w-full">

        <!-- Sidebar / Scratchpad & Snippet Manager -->
        <aside id="sidebar" class="w-80 h-full flex flex-col border-r border-slate-200/80 dark:border-slate-800/80 bg-slate-50/70 dark:bg-[#11131c] transition-all-custom relative z-20">
            
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm shadow-indigo-500/30">
                        <i class="fa-solid fa-code text-sm"></i>
                    </div>
                    <span class="font-bold text-base tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">ScribbleCode</span>
                </div>
                <div class="flex items-center space-x-1">
                    <!-- New Note Button -->
                    <button onclick="createNewNote()" title="New Scribble (Ctrl+N)" class="w-9 h-9 rounded-lg hover:bg-slate-200/70 dark:hover:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 transition-colors">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                    <!-- Toggle Theme Button -->
                    <button onclick="toggleTheme()" title="Toggle Theme" class="w-9 h-9 rounded-lg hover:bg-slate-200/70 dark:hover:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar & Tag Filters -->
            <div class="p-3 border-b border-slate-200/60 dark:border-slate-800/60 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterNotes()" placeholder="Search scribbles or code..." 
                        class="w-full bg-slate-200/60 dark:bg-slate-900/90 text-xs rounded-lg pl-9 pr-3 py-2 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 outline-none transition-all placeholder:text-slate-400">
                </div>
                <!-- Filter Tabs -->
                <div class="flex items-center space-x-1 text-[11px] overflow-x-auto py-0.5">
                    <button onclick="setFilterCategory('all')" id="filter-btn-all" class="px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 font-medium whitespace-nowrap transition-colors">All</button>
                    <button onclick="setFilterCategory('javascript')" id="filter-btn-javascript" class="px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 whitespace-nowrap transition-colors">JS</button>
                    <button onclick="setFilterCategory('html')" id="filter-btn-html" class="px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 whitespace-nowrap transition-colors">HTML</button>
                    <button onclick="setFilterCategory('python')" id="filter-btn-python" class="px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 whitespace-nowrap transition-colors">Python</button>
                    <button onclick="setFilterCategory('markdown')" id="filter-btn-markdown" class="px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 whitespace-nowrap transition-colors">MD</button>
                </div>
            </div>

            <!-- Notes List -->
            <div id="notes-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Dynamically populated -->
            </div>

            <!-- Sidebar Footer -->
            <div class="p-3 border-t border-slate-200/80 dark:border-slate-800/80 text-[11px] text-slate-400 dark:text-slate-500 flex justify-between items-center bg-slate-100/40 dark:bg-[#0e1017]">
                <span id="note-count">0 scribbles</span>
                <div class="flex items-center space-x-3">
                    <span class="hover:text-indigo-500 cursor-pointer transition-colors" onclick="openImportModal()"><i class="fa-solid fa-upload mr-1"></i> Import</span>
                    <span class="hover:text-indigo-500 cursor-pointer transition-colors" onclick="exportAllNotes()"><i class="fa-solid fa-download mr-1"></i> Export</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <main class="flex-1 h-full flex flex-col bg-white dark:bg-[#0b0d13] relative">

            <!-- Top Header / Toolbar -->
            <header class="h-14 border-b border-slate-200/80 dark:border-slate-800/80 px-6 flex items-center justify-between glass-panel z-10">
                
                <!-- Title & Sidebar Toggle -->
                <div class="flex items-center space-x-4 flex-1 mr-4">
                    <button onclick="toggleSidebar()" title="Toggle Sidebar" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 transition-colors">
                        <i class="fa-solid fa-bars-staggered text-xs"></i>
                    </button>
                    <input type="text" id="note-title-input" oninput="updateNoteTitle(this.value)" placeholder="Untitled Scribble..." 
                        class="bg-transparent font-semibold text-sm text-slate-900 dark:text-white outline-none w-full max-w-md truncate border-b border-transparent focus:border-indigo-500/50 pb-0.5 transition-colors">
                </div>

                <!-- Action Controls -->
                <div class="flex items-center space-x-2">
                    
                    <!-- Language Dropdown -->
                    <div id="language-selector-wrapper" class="flex items-center space-x-2">
                        <select id="language-select" onchange="updateNoteLanguage(this.value)" class="bg-slate-100 dark:bg-slate-800/90 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/80 outline-none cursor-pointer">
                            <option value="javascript">JavaScript</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="python">Python</option>
                            <option value="markdown">Markdown</option>
                            <option value="json">JSON</option>
                            <option value="sql">SQL</option>
                            <option value="text">Plain Text</option>
                        </select>
                    </div>

                    <!-- View Mode Switcher -->
                    <div class="bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl flex items-center space-x-1 border border-slate-200/60 dark:border-slate-700/60">
                        <button onclick="setMode('editor')" id="mode-btn-editor" class="px-3 py-1 text-xs font-medium rounded-lg transition-all">Editor</button>
                        <button onclick="setMode('preview')" id="mode-btn-preview" class="px-3 py-1 text-xs font-medium rounded-lg transition-all">Preview</button>
                        <button onclick="setMode('html-preview')" id="mode-btn-html-preview" class="hidden px-3 py-1 text-xs font-medium rounded-lg transition-all text-indigo-600 dark:text-indigo-400 font-semibold flex items-center space-x-1">
                            <i class="fa-solid fa-play text-[10px]"></i>
                            <span>HTML Run</span>
                        </button>
                    </div>

                    <div class="h-4 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                    <!-- Quick Format / Indent Helper -->
                    <button onclick="formatCurrentCode()" title="Format Code / Auto-indent" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 transition-colors">
                        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                    </button>

                    <!-- Copy Content -->
                    <button onclick="copyContent()" title="Copy Content" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-700 dark:text-slate-300 transition-colors flex items-center space-x-1.5">
                        <i class="fa-regular fa-copy"></i>
                        <span class="hidden sm:inline">Copy</span>
                    </button>

                    <!-- Delete Note -->
                    <button onclick="deleteCurrentNote()" title="Delete Scribble" class="w-9 h-9 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 hover:text-rose-600 dark:hover:text-rose-400 text-slate-400 flex items-center justify-center transition-colors">
                        <i class="fa-regular fa-trash-can text-xs"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content Panels -->
            <div class="flex-1 relative flex overflow-hidden">
                
                <!-- Code / Text Editor Container -->
                <div id="editor-container" class="absolute inset-0 flex bg-white dark:bg-[#0b0d13] overflow-hidden">
                    <!-- Line Numbers Sidebar -->
                    <div id="line-numbers" class="w-12 py-4 bg-slate-50 dark:bg-[#0e1017] border-r border-slate-200/60 dark:border-slate-800/60 text-right pr-3 font-mono text-xs text-slate-400 dark:text-slate-600 select-none overflow-hidden leading-relaxed">
                        1
                    </div>
                    <!-- Textarea Workspace -->
                    <textarea id="main-textarea" oninput="handleContentInput(this.value)" onscroll="syncScroll()" onkeydown="handleEditorKeyDown(event)" placeholder="Write your code, markdown, or snippets here..." 
                        class="flex-1 h-full p-4 bg-transparent resize-none outline-none font-mono text-xs leading-relaxed text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-600 whitespace-pre overflow-auto"></textarea>
                </div>

                <!-- Markdown / Document Preview Container -->
                <div id="preview-container" class="absolute inset-0 p-8 overflow-y-auto hidden prose dark:prose-invert max-w-none text-slate-800 dark:text-slate-200">
                    <!-- Markdown output generated here -->
                </div>

                <!-- Live HTML Sandbox Output -->
                <div id="html-preview-container" class="absolute inset-0 hidden bg-white flex flex-col">
                    <iframe id="html-preview-iframe" class="w-full h-full border-0"></iframe>
                </div>

            </div>

            <!-- Bottom Status Bar -->
            <footer class="h-8 border-t border-slate-200/80 dark:border-slate-800/80 px-6 flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500 bg-slate-50/70 dark:bg-[#0e1017]">
                <div class="flex items-center space-x-4">
                    <span id="status-mode-indicator"><i class="fa-solid fa-code text-indigo-500 mr-1.5"></i> Editor Mode</span>
                    <span><i class="fa-regular fa-clock mr-1"></i> <span id="last-edited-time">Saved</span></span>
                </div>
                <div class="flex items-center space-x-6">
                    <span id="cursor-position">Ln 1, Col 1</span>
                    <span id="word-count">0 words</span>
                    <span id="char-count">0 characters</span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Import Modal -->
    <div id="import-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="bg-white dark:bg-[#141722] rounded-2xl p-6 w-full max-w-md border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-slate-900 dark:text-white">Import Scribbles Backup</h3>
                <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Select a JSON export file previously generated from ScribbleCode to restore your notes.</p>
            <input type="file" id="import-file-input" accept=".json" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 dark:file:bg-indigo-950/60 dark:file:text-indigo-300 hover:file:bg-indigo-100 cursor-pointer">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeImportModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                <button onclick="processImportFile()" class="px-4 py-2 rounded-xl text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">Import Files</button>
            </div>
        </div>
    </div>

    <!-- Core Logic Implementation (Massive standalone engine) -->
    <script>
        // Default Sample Scribbles & State
        let notes = JSON.parse(localStorage.getItem('scribblecode_notes')) || [
            {
                id: '1',
                title: 'Welcome to ScribbleCode',
                content: '# Welcome to ScribbleCode\n\nA clean, distraction-free playground and snippet manager designed for developers.\n\n```javascript\n// Quick demonstration script\nconst calculatePrimes = (max) => {\n    const primes = [];\n    for (let i = 2; i <= max; i++) {\n        if (primes.every((p) => i % p !== 0)) {\n            primes.push(i);\n        }\n    }\n    return primes;\n};\n\nconsole.log(calculatePrimes(50));\n```\n\n- Zero clutter, instant local storage persistence\n- Built-in live HTML preview sandbox\n- Snippet management across JavaScript, HTML, Python, and Markdown',
                language: 'markdown',
                mode: 'editor',
                updatedAt: Date.now()
            },
            {
                id: '2',
                title: 'Interactive Canvas Particle Sim',
                content: '<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <title>Particle Playground</title>\n    <style>\n        body { margin: 0; background: #0b0f19; overflow: hidden; font-family: sans-serif; }\n        canvas { display: block; }\n        .hud { position: absolute; top: 20px; left: 20px; color: #fff; pointer-events: none; }\n    </style>\n</head>\n<body>\n    <div class="hud">\n        <h2>Interactive Particles</h2>\n        <p>Move mouse around to interact</p>\n    </div>\n    <canvas id="canvas"></canvas>\n    <script>\n        const canvas = document.getElementById("canvas");\n        const ctx = canvas.getContext("2d");\n        let width = canvas.width = window.innerWidth;\n        let height = canvas.height = window.innerHeight;\n\n        window.addEventListener("resize", () => {\n            width = canvas.width = window.innerWidth;\n            height = canvas.height = window.innerHeight;\n        });\n\n        const mouse = { x: width / 2, y: height / 2 };\n        window.addEventListener("mousemove", e => {\n            mouse.x = e.clientX;\n            mouse.y = e.clientY;\n        });\n\n        const particles = Array.from({ length: 80 }, () => ({\n            x: Math.random() * width,\n            y: Math.random() * height,\n            vx: (Math.random() - 0.5) * 2,\n            vy: (Math.random() - 0.5) * 2,\n            radius: Math.random() * 3 + 1,\n            color: `hsl(${Math.random() * 60 + 200}, 80%, 60%)`\n        }));\n\n        function animate() {\n            ctx.fillStyle = "rgba(11, 15, 25, 0.2)";\n            ctx.fillRect(0, 0, width, height);\n\n            particles.forEach(p => {\n                p.x += p.vx;\n                p.y += p.vy;\n\n                if (p.x < 0 || p.x > width) p.vx *= -1;\n                if (p.y < 0 || p.y > height) p.vy *= -1;\n\n                ctx.beginPath();\n                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);\n                ctx.fillStyle = p.color;\n                ctx.fill();\n            });\n\n            requestAnimationFrame(animate);\n        }\n        animate();\n    <\/script>\n</body>\n</html>',
                language: 'html',
                mode: 'editor',
                updatedAt: Date.now() - 3600000
            }
        ];

        let currentNoteId = notes[0] ? notes[0].id : null;
        let isDarkMode = localStorage.getItem('scribblecode_theme') === 'dark' || (!localStorage.getItem('scribblecode_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        let sidebarOpen = true;
        let activeFilter = 'all';

        // Initialization
        window.onload = function() {
            applyTheme();
            renderNotesList();
            loadCurrentNote();
            setupEventListeners();
        };

        // Theme Handling
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('scribblecode_theme', isDarkMode ? 'dark' : 'light');
            applyTheme();
        }

        function applyTheme() {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-xs';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon text-xs';
            }
        }

        // Sidebar Toggle
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            if (sidebarOpen) {
                sidebar.classList.remove('-ml-80');
                sidebar.style.display = 'flex';
            } else {
                sidebar.classList.add('-ml-80');
                setTimeout(() => { if (!sidebarOpen) sidebar.style.display = 'none'; }, 200);
            }
        }

        // Toast Notification Helper
        function showToast(message, icon = 'fa-circle-check text-emerald-400') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            
            msgEl.innerText = message;
            iconEl.className = `fa-solid ${icon} text-base`;
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        // Category Filter Management
        function setFilterCategory(cat) {
            activeFilter = cat;
            ['all', 'javascript', 'html', 'python', 'markdown'].forEach(c => {
                const btn = document.getElementById(`filter-btn-${c}`);
                if (!btn) return;
                if (c === cat) {
                    btn.className = 'px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 font-medium whitespace-nowrap transition-colors';
                } else {
                    btn.className = 'px-2.5 py-1 rounded-md text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800 whitespace-nowrap transition-colors';
                }
            });
            renderNotesList();
        }

        // Render Notes List in Sidebar
        function renderNotesList() {
            const listEl = document.getElementById('notes-list');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            listEl.innerHTML = '';

            let filtered = notes.filter(n => {
                const matchesSearch = n.title.toLowerCase().includes(searchQuery) || n.content.toLowerCase().includes(searchQuery);
                const matchesCat = activeFilter === 'all' || n.language === activeFilter;
                return matchesSearch && matchesCat;
            });

            document.getElementById('note-count').innerText = `${notes.length} scribble${notes.length === 1 ? '' : 's'}`;

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">No scribbles found</div>';
                return;
            }

            filtered.sort((a, b) => b.updatedAt - a.updatedAt);

            filtered.forEach(note => {
                const isSelected = note.id === currentNoteId;
                const dateStr = new Date(note.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                
                const item = document.createElement('div');
                item.className = `group p-3 rounded-xl cursor-pointer transition-all flex flex-col space-y-1 ${
                    isSelected 
                        ? 'bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/50 shadow-sm' 
                        : 'hover:bg-slate-200/50 dark:hover:bg-slate-800/60 border border-transparent'
                }`;
                item.onclick = () => selectNote(note.id);

                const badgeColor = getLanguageBadgeColor(note.language);

                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-medium text-xs truncate ${isSelected ? 'text-indigo-900 dark:text-indigo-200 font-semibold' : 'text-slate-700 dark:text-slate-300'}">
                            ${escapeHtml(note.title || 'Untitled')}
                        </span>
                        <span class="text-[9px] uppercase px-1.5 py-0.5 rounded font-mono font-semibold ${badgeColor}">${note.language || 'text'}</span>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500">
                        <span class="truncate font-mono pr-2">${escapeHtml(note.content || 'Empty scribble...')}</span>
                        <span class="whitespace-nowrap">${dateStr}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function filterNotes() {
            renderNotesList();
        }

        function getLanguageBadgeColor(lang) {
            switch(lang) {
                case 'javascript': return 'bg-amber-100 text-amber-800 dark:bg-amber-950/50 dark:text-amber-300';
                case 'html': return 'bg-orange-100 text-orange-800 dark:bg-orange-950/50 dark:text-orange-300';
                case 'css': return 'bg-sky-100 text-sky-800 dark:bg-sky-950/50 dark:text-sky-300';
                case 'python': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-300';
                case 'markdown': return 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950/50 dark:text-indigo-300';
                case 'json': return 'bg-purple-100 text-purple-800 dark:bg-purple-950/50 dark:text-purple-300';
                default: return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
            }
        }

        // Scribble CRUD actions
        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: 'Untitled Scribble',
                content: '',
                language: 'javascript',
                mode: 'editor',
                updatedAt: Date.now()
            };
            notes.unshift(newNote);
            saveToLocalStorage();
            currentNoteId = newNote.id;
            renderNotesList();
            loadCurrentNote();
            document.getElementById('note-title-input').focus();
            showToast('Created new scribble');
        }

        function selectNote(id) {
            currentNoteId = id;
            renderNotesList();
            loadCurrentNote();
        }

        function loadCurrentNote() {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            document.getElementById('note-title-input').value = note.title;
            const textarea = document.getElementById('main-textarea');
            textarea.value = note.content;
            document.getElementById('language-select').value = note.language || 'javascript';
            
            checkHtmlPreviewAvailability(note.language);
            setMode(note.mode || 'editor', false);
            updateStatsAndCursor(note.content);
            updateLineNumbers();
            updateTimeDisplay(note.updatedAt);
        }

        function updateNoteTitle(title) {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;
            note.title = title;
            note.updatedAt = Date.now();
            saveToLocalStorage();
            renderNotesList();
        }

        function handleContentInput(content) {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;
            note.content = content;
            note.updatedAt = Date.now();
            saveToLocalStorage();
            
            updateStatsAndCursor(content);
            updateLineNumbers();
            updateTimeDisplay(note.updatedAt);
            renderNotesList();

            if (note.mode === 'preview') {
                renderPreview(content);
            } else if (note.mode === 'html-preview') {
                renderHtmlPreview(content);
            }
        }

        function updateNoteLanguage(lang) {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;
            note.language = lang;
            checkHtmlPreviewAvailability(lang);
            saveToLocalStorage();
            renderNotesList();
        }

        function checkHtmlPreviewAvailability(lang) {
            const htmlPreviewBtn = document.getElementById('mode-btn-html-preview');
            if (lang === 'html') {
                htmlPreviewBtn.classList.remove('hidden');
            } else {
                htmlPreviewBtn.classList.add('hidden');
                const note = notes.find(n => n.id === currentNoteId);
                if (note && note.mode === 'html-preview') {
                    setMode('editor');
                }
            }
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                showToast('Cannot delete the last remaining scribble', 'fa-triangle-exclamation text-amber-400');
                return;
            }
            const idx = notes.findIndex(n => n.id === currentNoteId);
            if (idx > -1) {
                notes.splice(idx, 1);
                saveToLocalStorage();
                currentNoteId = notes[0].id;
                renderNotesList();
                loadCurrentNote();
                showToast('Scribble deleted');
            }
        }

        // Mode Switching
        function setMode(mode, save = true) {
            const note = notes.find(n => n.id === currentNoteId);
            if (note && save) {
                note.mode = mode;
                saveToLocalStorage();
            }

            const editorContainer = document.getElementById('editor-container');
            const previewContainer = document.getElementById('preview-container');
            const htmlPreviewContainer = document.getElementById('html-preview-container');
            
            const btnEditor = document.getElementById('mode-btn-editor');
            const btnPreview = document.getElementById('mode-btn-preview');
            const btnHtmlPreview = document.getElementById('mode-btn-html-preview');
            const langWrapper = document.getElementById('language-selector-wrapper');
            const statusIndicator = document.getElementById('status-mode-indicator');

            editorContainer.classList.add('hidden');
            previewContainer.classList.add('hidden');
            htmlPreviewContainer.classList.add('hidden');

            btnEditor.className = 'px-3 py-1 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all';
            btnPreview.className = 'px-3 py-1 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all';
            if (btnHtmlPreview) {
                btnHtmlPreview.className = 'hidden px-3 py-1 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all';
                if (note && note.language === 'html') {
                    btnHtmlPreview.classList.remove('hidden');
                }
            }

            if (mode === 'preview') {
                previewContainer.classList.remove('hidden');
                btnPreview.className = 'px-3 py-1 text-xs font-medium rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm transition-all';
                langWrapper.style.display = 'none';
                statusIndicator.innerHTML = '<i class="fa-solid fa-eye text-indigo-500 mr-1.5"></i> Markdown Preview';
                renderPreview(note ? note.content : '');
            } else if (mode === 'html-preview') {
                htmlPreviewContainer.classList.remove('hidden');
                if (btnHtmlPreview) {
                    btnHtmlPreview.className = 'px-3 py-1 text-xs font-medium rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 shadow-sm transition-all font-semibold flex items-center space-x-1';
                }
                langWrapper.style.display = 'none';
                statusIndicator.innerHTML = '<i class="fa-solid fa-play text-emerald-500 mr-1.5"></i> HTML Live Output';
                renderHtmlPreview(note ? note.content : '');
            } else {
                editorContainer.classList.remove('hidden');
                btnEditor.className = 'px-3 py-1 text-xs font-medium rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm transition-all';
                langWrapper.style.display = 'flex';
                statusIndicator.innerHTML = '<i class="fa-solid fa-code text-indigo-500 mr-1.5"></i> Editor Mode';
            }
        }

        // Live HTML Sandbox Runner
        function renderHtmlPreview(content) {
            const iframe = document.getElementById('html-preview-iframe');
            const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
            iframe.src = URL.createObjectURL(blob);
        }

        // Markdown Preview Renderer
        function renderPreview(content) {
            const previewContainer = document.getElementById('preview-container');
            if (!content.trim()) {
                previewContainer.innerHTML = '<p class="text-slate-400 italic">Nothing to preview...</p>';
                return;
            }

            let html = escapeHtml(content)
                .replace(/```([\s\S]*?)```/g, '<pre class="bg-slate-100 dark:bg-slate-800/80 p-4 rounded-xl font-mono text-xs overflow-x-auto my-3 border border-slate-200 dark:border-slate-700"><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code class="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-xs font-mono text-indigo-600 dark:text-indigo-400">$1</code>')
                .replace(/^### (.*$)/gm, '<h3 class="text-lg font-bold mt-4 mb-2">$1</h3>')
                .replace(/^## (.*$)/gm, '<h2 class="text-xl font-bold mt-6 mb-3">$1</h2>')
                .replace(/^# (.*$)/gm, '<h1 class="text-2xl font-extrabold mt-6 mb-4">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                .replace(/\n/g, '<br>');

            previewContainer.innerHTML = html;
        }

        // Line Numbers & Synchronized Scrolling
        function updateLineNumbers() {
            const textarea = document.getElementById('main-textarea');
            const lineNumbers = document.getElementById('line-numbers');
            const lines = textarea.value.split('\n').length;
            
            let lineStr = '';
            for (let i = 1; i <= Math.max(lines, 1); i++) {
                lineStr += i + '<br>';
            }
            lineNumbers.innerHTML = lineStr;
        }

        function syncScroll() {
            const textarea = document.getElementById('main-textarea');
            const lineNumbers = document.getElementById('line-numbers');
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        // Editor Key Handling (Tab indentation & auto bracket pairs)
        function handleEditorKeyDown(e) {
            const textarea = e.target;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;

            // Tab indentation support
            if (e.key === 'Tab') {
                e.preventDefault();
                textarea.value = textarea.value.substring(0, start) + '    ' + textarea.value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + 4;
                handleContentInput(textarea.value);
            }

            // Quick auto-closing brackets & quotes
            const pairs = { '{': '}', '[': ']', '(': ')', '"': '"', "'": "'" };
            if (pairs[e.key] && start === end) {
                e.preventDefault();
                const closing = pairs[e.key];
                textarea.value = textarea.value.substring(0, start) + e.key + closing + textarea.value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + 1;
                handleContentInput(textarea.value);
            }
        }

        // Code Formatter helper
        function formatCurrentCode() {
            const textarea = document.getElementById('main-textarea');
            let content = textarea.value;
            // Simple auto-indent beautifier simulation
            let lines = content.split('\n');
            let indentLevel = 0;
            let formattedLines = lines.map(line => {
                let trimmed = line.trim();
                if (trimmed.startsWith('}') || trimmed.startsWith('</') || trimmed.startsWith(']')) {
                    indentLevel = Math.max(0, indentLevel - 1);
                }
                let indented = '    '.repeat(indentLevel) + trimmed;
                if (trimmed.endsWith('{') || trimmed.endsWith('[') || (trimmed.endsWith('>') && !trimmed.startsWith('</') && !trimmed.endsWith('/>'))) {
                    indentLevel++;
                }
                return indented;
            });
            textarea.value = formattedLines.join('\n');
            handleContentInput(textarea.value);
            showToast('Code formatted');
        }

        // Stats & Cursor Position tracking
        function updateStatsAndCursor(content) {
            const textarea = document.getElementById('main-textarea');
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            const chars = content.length;
            
            document.getElementById('word-count').innerText = `${words} word${words === 1 ? '' : 's'}`;
            document.getElementById('char-count').innerText = `${chars} char${chars === 1 ? '' : 's'}`;

            // Calculate line & col
            const cursorPosition = textarea.selectionStart;
            const textBefore = content.substring(0, cursorPosition);
            const line = textBefore.split('\n').length;
            const col = cursorPosition - textBefore.lastIndexOf('\n');
            document.getElementById('cursor-position').innerText = `Ln ${line}, Col ${col}`;
        }

        function updateTimeDisplay(timestamp) {
            const timeEl = document.getElementById('last-edited-time');
            const diffSec = Math.floor((Date.now() - timestamp) / 1000);
            if (diffSec < 10) {
                timeEl.innerText = 'Saved just now';
            } else {
                timeEl.innerText = `Saved at ${new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            }
        }

        function setupEventListeners() {
            const textarea = document.getElementById('main-textarea');
            ['click', 'keyup', 'focus'].forEach(evt => {
                textarea.addEventListener(evt, () => {
                    updateStatsAndCursor(textarea.value);
                });
            });

            // Global Ctrl+N shortcut for new scribble
            window.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    createNewNote();
                }
            });
        }

        // Copy content helper
        function copyContent() {
            const content = document.getElementById('main-textarea').value;
            const textArea = document.createElement("textarea");
            textArea.value = content;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Copied to clipboard');
            } catch (err) {
                showToast('Failed to copy', 'fa-triangle-exclamation text-rose-400');
            }
            document.body.removeChild(textArea);
        }

        // Export and Import Modals
        function exportAllNotes() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `scribblecode_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Exported all scribbles');
        }

        function openImportModal() {
            document.getElementById('import-modal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('import-modal').classList.add('hidden');
        }

        function processImportFile() {
            const fileInput = document.getElementById('import-file-input');
            if (fileInput.files.length === 0) {
                showToast('Please select a JSON backup file', 'fa-triangle-exclamation text-amber-400');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        notes = imported;
                        saveToLocalStorage();
                        currentNoteId = notes[0] ? notes[0].id : null;
                        renderNotesList();
                        loadCurrentNote();
                        closeImportModal();
                        showToast('Successfully imported scribbles');
                    } else {
                        showToast('Invalid backup format', 'fa-triangle-exclamation text-rose-400');
                    }
                } catch (err) {
                    showToast('Error parsing JSON file', 'fa-triangle-exclamation text-rose-400');
                }
            };
            reader.readAsText(file);
        }

        function saveToLocalStorage() {
            localStorage.setItem('scribblecode_notes', JSON.stringify(notes));
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
